# Builds snaq and runs the unit tests on Linux, macOS and Windows, and with the
# oldest compilers and CMake that the README promises to support.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,   os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: Linux Clang, os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: macOS,       os: macos-latest }
          - { name: Windows,     os: windows-latest }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAQPP_BUILD_TESTS=ON -DSNAQPP_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

  # Oldest supported toolchain: Ubuntu 20.04 ships CMake 3.16 (the minimum in
  # CMakeLists.txt), GCC 9 and Clang 9 (the minimums in the README).
  oldest-compilers:
    name: Oldest (${{ matrix.cxx }}, CMake 3.16)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc-9,   cxx: g++-9 }
          - { cc: clang-9, cxx: clang++-9 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake make git ca-certificates g++-9 clang-9
          cmake --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAQPP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: cd build && ctest --output-on-failure --parallel 4
